<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Breaking News!</title>
    <style>
        /* Base setup for the pitch-black full screen */
        body {
            background-color: black;
            color: white;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* Pushes content to absolute top and bottom */
            overflow: hidden; /* Stops mobile browsers from creating side-scrollbars */
        }

        /* Top container for the moving text */
        .marquee-container {
            background-color: black;
            width: 100%;
            padding: 15px 0;
            border-bottom: 2px solid red; /* Line underneath the breaking news */
            overflow: hidden; /* Key fix for mobile layout scaling */
            position: relative;
        }

        /* The moving text styling */
        .marquee-text {
            display: inline-block;
            color: red;
            font-size: 2.5rem; /* Slightly adapted size for mobile balance */
            font-weight: bold;
            white-space: nowrap;
            padding-left: 100%; /* Starts the text completely off-screen */
            animation: scroll-left 12s linear infinite;
        }

        /* The animation mechanics optimized for mobile rendering */
        @keyframes scroll-left {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        /* Container that groups your bottom blocks together */
        .bottom-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start; /* Aligns the text blocks and divider to the left */
            align-self: center;      /* Centers the entire group on the screen */
            padding: 20px;           /* Reduced padding for smaller phone screens */
            width: 85%;              /* Sets a safe boundary on mobile boundaries */
            box-sizing: border-box;
            margin-bottom: 20px;     /* Keeps it slightly off the absolute screen edge on mobile */
        }

        /* Message 2 style (Top message at the bottom) */
        .bottom-message-2 {
            text-align: left; 
            font-size: 1.3rem; /* Scaled down slightly for phone readability */
            color: #ffb6c1; /* Soft pink */
            letter-spacing: 1px;
            margin-bottom: 12px;
            line-height: 1.4;
            width: 100%;
        }

        /* Message 1 style (Bottom message at the bottom) */
        .bottom-message {
            text-align: left; 
            font-size: 1.3rem; /* Scaled down slightly for phone readability */
            color: #ffb6c1; /* Soft pink */
            letter-spacing: 1px;
            margin-top: 12px;
            line-height: 1.4;
            width: 100%;
        }

        /* Styling for the small date labels starting with the text */
        .entry-date {
            display: block;    
            font-size: 0.85rem;  
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 6px;
            opacity: 0.7;       
            text-align: left;   
        }

        /* The divider line that matches the exact width of your text blocks */
        .bottom-divider {
            border: none;
            border-top: 2px solid red;
            width: 100%; 
            margin: 5px 0;
        }
    </style>
</head>
<body>

    <div class="marquee-container">
        <div class="marquee-text">BREAKING NEWS! &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; BREAKING NEWS! &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; BREAKING NEWS!</div>
    </div>

    <div class="bottom-container">
        
        <div class="bottom-message-2">
            <span class="entry-date">7 June</span>
            Most recent research showes someone in this country looooooves you over there very much
        </div>

        <hr class="bottom-divider">

        <div class="bottom-message">
            <span class="entry-date">5 June</span>
            Did you know that there is someone who loves you too?!
        </div>

    </div>

</body>
</html>
